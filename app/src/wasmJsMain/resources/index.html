<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Resolve all relative URLs (script, .wasm, Compose resources) against the
         origin root, so deep-link paths like /{id}/edit still load assets from /. -->
    <base href="/">
    <title>Composer</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <style>
        html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
        /* ComposeViewport container — it creates its own canvas inside. */
        #composer { position: absolute; inset: 0; outline: none; }

        /* Boot loader — shown while the .wasm bundle downloads/instantiates;
           the app fades it out on first composition (see Root()). Colors match
           the editor theme (dark unless localStorage says light). */
        #loader {
            position: fixed; inset: 0; z-index: 10;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 18px; background: #0E1014;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            transition: opacity .35s ease; opacity: 1;
        }
        #loader.light { background: #ECEEF2; }
        #loader.done { opacity: 0; pointer-events: none; }
        #loader .mark {
            width: 56px; height: 56px;
            animation: loaderPulse 1.6s ease-in-out infinite;
        }
        #loader .name { color: #E7E9EE; font-size: 15px; font-weight: 600; letter-spacing: .3px; }
        #loader.light .name { color: #1E2128; }
        #loader .bar {
            width: 160px; height: 3px; border-radius: 2px; overflow: hidden;
            background: rgba(128, 136, 160, .25); position: relative;
        }
        #loader .bar::after {
            content: ""; position: absolute; top: 0; left: -40%; width: 40%; height: 100%;
            border-radius: 2px; background: #6E7BF2;
            animation: loaderSlide 1.2s ease-in-out infinite;
        }
        #loader.light .bar::after { background: #5563E8; }
        #loader .hint { color: #8A90A0; font-size: 12px; }
        #loader .reload {
            display: none; margin-top: 4px; padding: 7px 18px; border: 0; border-radius: 8px;
            background: #6E7BF2; color: #fff; font-size: 13px; font-weight: 600; cursor: pointer;
        }
        #loader.failed .bar { display: none; }
        #loader.failed .mark { animation: none; }
        #loader.failed .reload { display: block; }
        @keyframes loaderPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.07); } }
        @keyframes loaderSlide { 0% { left: -40%; } 100% { left: 100%; } }

        /* Mobile gate — the editor needs a desktop-sized screen; on small
           viewports this covers the app (CSS-only, so resizing a desktop
           window in/out of the breakpoint shows/hides it live). */
        #mobile-gate {
            position: fixed; inset: 0; z-index: 20;
            display: none; flex-direction: column; align-items: center; justify-content: center;
            gap: 14px; padding: 32px; text-align: center; background: #0E1014;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        #mobile-gate.light { background: #ECEEF2; }
        #mobile-gate .mark {
            width: 56px; height: 56px;
        }
        #mobile-gate .title { color: #E7E9EE; font-size: 17px; font-weight: 600; }
        #mobile-gate.light .title { color: #1E2128; }
        #mobile-gate .body { color: #8A90A0; font-size: 13px; line-height: 1.5; max-width: 300px; }
        @media (max-width: 767px) {
            #mobile-gate { display: flex; }
        }
    </style>
    <script>
        // Keep the design-zoom GESTURE (ctrl/cmd + wheel / trackpad pinch) from zooming
        // the whole page. preventDefault cancels only the browser's page-zoom — the
        // Compose canvas still receives the wheel event and zooms the design itself.
        // Note: keyboard zoom (Cmd/Ctrl +/-/0) is intentionally left alone, so you can
        // always reset the browser's own zoom level.
        window.addEventListener('wheel', function (e) {
            if (e.ctrlKey) e.preventDefault();
        }, { passive: false });
        ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (type) {
            window.addEventListener(type, function (e) { e.preventDefault(); }, { passive: false });
        });
    </script>
</head>
<body>
    <div id="composer"></div>
    <div id="loader">
        <img class="mark" src="/logo.svg" alt="Composer">
        <div class="name">Composer</div>
        <div class="bar"></div>
        <div class="hint" id="loader-hint">Loading the editor…</div>
        <button class="reload" onclick="location.reload()">Reload</button>
    </div>
    <div id="mobile-gate">
        <img class="mark" src="/logo.svg" alt="Composer">
        <div class="title">Composer needs a bigger screen</div>
        <div class="body">This is a desktop design tool. Please open it on a laptop or desktop browser to start designing.</div>
    </div>
    <script>
        // Match the loader + mobile gate to the saved editor theme before any paint.
        if (localStorage.getItem('composer.theme') === 'light') {
            document.getElementById('loader').classList.add('light');
            document.getElementById('mobile-gate').classList.add('light');
        }
        // If the app fails to boot (e.g. a stale cached bundle referencing a
        // previous deploy's .wasm), don't spin forever — offer a reload.
        function composerBootFailed() {
            var loader = document.getElementById('loader');
            if (!loader || loader.classList.contains('done')) return; // app already up
            loader.classList.add('failed');
            document.getElementById('loader-hint').textContent =
                'Something went wrong while loading. If this keeps happening, try a hard refresh (Ctrl/Cmd+Shift+R).';
        }
        window.addEventListener('error', composerBootFailed);
        window.addEventListener('unhandledrejection', composerBootFailed);
    </script>
    <script src="/composer.js"></script>
</body>
</html>
