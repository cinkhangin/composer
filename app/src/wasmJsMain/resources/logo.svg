<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Composer logo</title>
  <desc id="desc">A minimalist C-shaped geometric ribbon mark in Composer's indigo brand colors: a light indigo top, deep indigo left, and vivid indigo bottom segment.</desc>
  <defs>
    <!-- Tonal indigo triad around the brand accent (#6E7BF2 / #5563E8). Each
         gradient runs along its ribbon's flow so the light reads as one sweep:
         bright at the top-right opening, deepest in the left spine, vivid again
         as the ribbon returns at the bottom. -->
    <linearGradient id="ribbonTop" x1="334" y1="220" x2="782" y2="430" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A5AEFF"/>
      <stop offset="0.55" stop-color="#8A95F6"/>
      <stop offset="1" stop-color="#6E7BF2"/>
    </linearGradient>
    <linearGradient id="ribbonSpine" x1="300" y1="318" x2="420" y2="792" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3A4290"/>
      <stop offset="1" stop-color="#232860"/>
    </linearGradient>
    <linearGradient id="ribbonBottom" x1="373" y1="820" x2="790" y2="620" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4351DF"/>
      <stop offset="1" stop-color="#6E7BF2"/>
    </linearGradient>
    <!-- Soft brand-tinted shadow: tighter and quieter than a generic drop. -->
    <filter id="softShadow" x="180" y="150" width="690" height="750" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#2B3280" flood-opacity="0.16"/>
    </filter>
  </defs>

  <g filter="url(#softShadow)">
    <!-- Top ribbon segment (light indigo) -->
    <path d="M334.67 326.5L501.95 221.77C519.98 210.48 542.9 210.48 560.93 221.77L759.35 346.02C791.6 366.22 785.8 416.6 750.16 429.09C734.87 434.45 718.02 432.44 704.33 423.61L545.92 321.47C535.93 315.03 523.09 315.03 513.1 321.47L374.9 410.58C354.18 423.94 326.6 409.07 326.6 384.43V369.95C326.6 352.02 335.31 335.2 334.67 326.5Z" fill="url(#ribbonTop)"/>

    <!-- Left ribbon spine (deep indigo) -->
    <path d="M251.03 365.11C251.03 346.05 260.82 328.34 276.96 318.2L374.94 410.58C365.95 416.38 360.53 426.34 360.53 437.05V624.93C360.53 635.94 366.22 646.17 375.57 651.91L487.52 720.67L373.46 792.05L279.22 734.12C261.72 723.36 251.03 704.3 251.03 683.76V365.11Z" fill="url(#ribbonSpine)"/>

    <!-- Bottom ribbon segment (vivid indigo) -->
    <path d="M373.46 792.05L487.52 720.67L659.53 615.77C673.73 607.11 691.54 607.02 705.82 615.53L758.96 647.19C790.87 666.2 789.42 712.87 756.38 729.87L556.33 832.77C539.2 841.58 518.77 841.1 502.07 831.5L373.46 792.05Z" fill="url(#ribbonBottom)"/>
  </g>
</svg>
